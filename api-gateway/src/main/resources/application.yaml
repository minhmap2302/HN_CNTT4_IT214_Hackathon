server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: author-service
              uri: lb://author-service
              predicates:
                - Path=/api/authors/**
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/api/books/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
